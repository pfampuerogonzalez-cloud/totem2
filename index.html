<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Self-Service</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="app-container">
        <aside class="sidebar">
            <div class="logo">🍟 Kiosko</div>
            <nav id="categories">
                <button class="cat-btn active" data-category="todos">Todos</button>
                <button class="cat-btn" data-category="hamburguesas">Burgers</button>
                <button class="cat-btn" data-category="papas">Papas</button>
                <button class="cat-btn" data-category="bebidas">Bebidas</button>
            </nav>
        </aside>

        <section class="menu-section">
            <header>
                <h1>¿Qué se te antoja hoy?</h1>
            </header>
            <div id="grid-productos" class="grid-productos">
                </div>
        </section>

        <section class="cart-section">
            <h3>Tu Pedido</h3>
            <div id="cart-items"></div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="total-amount">$0.00</span>
            </div>
            <button id="btn-pay" class="pay-button">Finalizar Pedido</button>
        </section>
    </main>

    <script src="assets/js/app.js" type="module"></script>
</body>
</html>
